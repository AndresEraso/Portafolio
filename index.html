<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duber Andrés Eraso Uni — Desarrollador Backend & Cloud</title>
    <meta
      name="description"
      content="Portafolio de Duber Andrés Eraso Uni, estudiante de Ingeniería de Sistemas en la Universidad del Cauca y desarrollador de back-end orientado a Backend, Cloud Computing (AWS), procesamiento de datos y sistemas distribuidos."
    />
    <meta name="theme-color" content="#0a0e17" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Open Graph Básico -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Duber Andrés Eraso Uni — Desarrollador Backend & Cloud" />
    <meta
      property="og:description"
      content="Portafolio profesional de desarrollo backend, cloud computing (AWS) y sistemas distribuidos."
    />
    <meta property="og:locale" content="es_CO" />

    <!-- Script anti-parpadeo de tema e idioma -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('portfolio-theme');
          if (savedTheme === 'light' || savedTheme === 'dark') {
            document.documentElement.dataset.theme = savedTheme;
          } else {
            document.documentElement.dataset.theme = 'dark';
          }

          var savedLang = localStorage.getItem('portfolio-lang');
          if (savedLang === 'en' || savedLang === 'es') {
            document.documentElement.lang = savedLang;
          } else {
            document.documentElement.lang = 'es';
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.lang = 'es';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
