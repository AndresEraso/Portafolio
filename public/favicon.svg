<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d120f" />
      <stop offset="100%" stop-color="#141c17" />
    </linearGradient>
  </defs>
  <!-- Background rect with technical border -->
  <rect width="64" height="64" rx="4" fill="url(#bg)" />
  <rect x="2" y="2" width="60" height="60" rx="3" fill="none" stroke="#27372d" stroke-width="2" />
  
  <!-- Terminal Prompt Symbol -->
  <text x="10" y="23" font-family="'JetBrains Mono', 'Cascadia Code', monospace" font-size="12" fill="#52ab2c" font-weight="700">&gt;</text>
  <rect x="18" y="14" width="6" height="10" fill="#52ab2c" opacity="0.8" />
  
  <!-- Monogram DE -->
  <text x="32" y="47" font-family="'JetBrains Mono', 'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="22" fill="#e5efe7" text-anchor="middle" letter-spacing="1">DE</text>
  
  <!-- Active System Pulse Dot -->
  <circle cx="50" cy="18" r="3.5" fill="#52ab2c" />
</svg>
